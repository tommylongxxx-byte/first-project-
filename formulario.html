<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">
        <div class="form-personal">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre">
        </div>
        <div class="form-personal">
            <label for="email">Correo Electrónico:</label>
            <input type="email" id="email" name="email">
        </div>
        <div class="form-personal">
            <label for="rol">Rol:</label>
            <input type="text" id="rol" name="rol">
        </div>
        <div class="form-personal">
            <label for="priority">Prioridad:</label>
            <input type="number" id="priority" name="priority">
        </div>
        <button type="submit">Enviar</button>

    </form>
    <div id="modal">
        <button onclick="closeModal()">x</button>
    </div>
    <script>
        const form = document.querySelector('form');
        form.addEventListener('submit', (event) => {
            console.log(event, 'evento submit');
            event.preventDefault(); // Evita que el formulario se envíe de forma tradicional
            const nombre = document.getElementById('nombre').value;
            const email = document.getElementById('email').value;
            const rol = document.getElementById('rol').value;
            const priority = document.getElementById('priority').value;
            console.log(`Nombre: ${nombre}, Email: ${email}, Rol: ${rol}, Prioridad: ${priority}`);
            const modal = document.getElementById('modal');
            const name=document.createElement('p');
            name.textContent=`Nombre: ${nombre}`;
            const emailElement=document.createElement('p');
            emailElement.textContent=`Email: ${email}`;
            const rolElement=document.createElement('p');
            rolElement.textContent=`Rol: ${rol}`;
            const priorityElement=document.createElement('p');
            priorityElement.textContent=`Prioridad: ${priority}`;
            modal.appendChild(name);
            modal.appendChild(emailElement);
            modal.appendChild(rolElement);
            modal.appendChild(priorityElement);
            modal.style.display = 'block'; // Muestra el modal
        });
        function closeModal() {
            const modal = document.getElementById('modal');
            modal.style.display = 'none';
        }


    </script>
    <style>
        #modal{
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: white;
            padding: 20px;
            border: 1px solid black;
            display:none;
        
        }
    </style>
       
    </style>
</body>
</html>
