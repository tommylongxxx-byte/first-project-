<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Grid Layout</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Grid simple 3x3 -->
  <section class="grid-simple">
    <h2>Grid Simple 3x3</h2>
    <div class="grid-container-simple">
      <div class="grid-item item-1">1</div>
      <div class="grid-item item-2">2</div>
      <div class="grid-item item-3">3</div>
      <div class="grid-item item-4">4</div>
      <div class="grid-item item-5">5</div>
      <div class="grid-item item-6">6</div>
      <div class="grid-item item-7">7</div>
      <div class="grid-item item-8">8</div>
      <div class="grid-item item-9">9</div>
    </div>
  </section>

  <!-- Layout de página completo -->
  <section class="page-layout">
    <h2>Layout de Página Completo</h2>
    <div class="grid-container-page">
      <header class="header">Header</header>
      <nav class="nav">Nav</nav>
      <main class="main">Main Content</main>
      <aside class="sidebar">Sidebar</aside>
      <footer class="footer">Footer</footer>
    </div>
  </section>

  <!-- Grid responsivo -->
  <section class="responsive-grid">
    <h2>Grid Responsivo</h2>
    <div class="grid-container-responsive">
      <div class="grid-item-resp">Tarjeta 1</div>
      <div class="grid-item-resp">Tarjeta 2</div>
      <div class="grid-item-resp">Tarjeta 3</div>
      <div class="grid-item-resp">Tarjeta 4</div>
      <div class="grid-item-resp">Tarjeta 5</div>
      <div class="grid-item-resp">Tarjeta 6</div>
    </div>
  </section>
   <section class="grid-simple">
    <h2>Grid Simple 3x3</h2>
    <div class="grid-container-simple" id="grid-redes">
    </div>
  </section>

</body>
</html>
