<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body> 
 <ul class="lista">
        <li id="item-1" class="item"></li>
        <li id="item-2" class="item"></li>
        <li id="item-3" class="item"></li>
        <li id="item-4" class="item"></li>
        <li id="item-5" class="item"></li>
    </ul>
    <ul class="lista-2">
      <li id="item-6" class="item"></li>
      <li id="item-7" class="item"></li>
      <li id="item-8" class="item"></li>
      <li id="item-9" class="item"></li>
      <li id="item-10" class="item"></li>
      <li id="item-11" class="item"></li>
      <li id="item-12" class="item"></li>
      <li id="item-13" class="item"></li>
      <li id="item-14" class="item"></li>
      <li id="item-15" class="item"></li>
    </ul>
    <div class="square-container">
        <div class="square" style="--color: coral">
        </div>
    </div>
</body>
<style>
    /* clase en html es class="nombre de clase" esto sirve para agregar estilos a varios elementos a la vez */
    /* id en html es id="nombre de id" esto sirve para agregar estilos a un solo elemento */
    /* selector de elemento es el nombre de la etiqueta html, sirve para agregar estilos a todos los elementos de ese tipo */
    /* selector universal es * sirve para agregar estilos a todos los elementos */

    .lista{
        display: grid; /* Utiliza Grid para el contenedor */
        grid-template-columns: repeat(5, 1fr); /* Crea 5 columnas de igual tamaño */
        gap:12px 16px; /* Espacio entre filas y columnas */
    }
    .item{
        background-color: lightblue; /* Color de fondo para visualizar los ítems */
        list-style: none; /* Elimina los puntos de la lista */
        height: 30px; /* Altura fija para los ítems */
    }   
    #item-1{
        background-color: lightcoral; /* Color específico para el primer ítem */
    }
    #item-2{
        background-color: lightseagreen;
    }
    #item-3{
        background-color: lightgoldenrodyellow;
    }
    #item-4{
        background-color: lightpink;
    }
    #item-5{
        background-color: lightgray;
    }
    
    .lista-2{
        display: grid;
        grid-template-columns: repeat(10, 1fr);
        gap: 12px 16px;
    }
    #item-6{
        background-color: lavender;
    }
    #item-7{
        background-color: lightcyan;
    }
    #item-8{
        background-color: lightsteelblue;
    }
    #item-9{
        background-color: lightyellow;
    }
    #item-10{
        background-color: lightgreen;
    }               
    #item-11{
        background-color: lightsalmon;
    }
    #item-12{
        background-color: lightblue;
    }
    #item-13{
        background-color: lightcoral;
    }
    #item-14{
        background-color: lightseagreen;
    }
    #item-15{
        background-color: lightgoldenrodyellow;
    }
    .square{
        width: 100px;
        height: 100px;
        background-color: var(--color);
        transform-origin:center;
        animation: spin 4s linear infinite;


    }
    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    .square:hover{
        animation-play-state: paused;
        }  
    .square-container{
        display: flex;
        justify-content: center;
        align-items: center;
        
    }
</style>
</html>
