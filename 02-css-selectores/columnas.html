<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <ul class="lista">
        <li id="item-1" class="item"></li>
        <li id="item-2" class="item"></li>
        <li id="item-3" class="item"></li>
        <li id="item-4" class="item"></li>
        <li id="item-5" class="item"></li>
    </ul>
    <ul class="lista-2">
      <li id="item-6" class="item"></li>
      <li id="item-7" class="item"></li>
      <li id="item-8" class="item"></li>
      <li id="item-9" class="item"></li>
      <li id="item-10" class="item"></li>

      <li id="item-14" class="item"></li>
      <li id="item-15" class="item"></li>
    </ul>
<style>
    .lista{
        display: flex; /* Utiliza Flexbox para el contenedor */
        flex-direction:row; /* Alinea los ítems en una fila */
    }
    .item{
        background-color: lightblue; /* Color de fondo para visualizar los ítems */
        margin: 5px; /* Espacio entre ítems */
        width: 20%; /* Cada ítem ocupa el 20% del ancho del contenedor */
        list-style: none; /* Elimina los puntos de la lista */
    }   
    #item-1{
        background-color: lightcoral; /* Color específico para el primer ítem */
    }
    #item-2{
        background-color: lightseagreen;
    }
    #item-3{
        background-color: lightgoldenrodyellow;
    }
    #item-4{
        background-color: lightpink;
    }
    #item-5{
        background-color: lightgray;
    }
    .lista-2{
        display: flex;
        flex-direction: row;
    }
    #item-6{
        background-color: lavender;
    }
    #item-7{
        background-color: lightcyan;
    }
    #item-8{
        background-color: lightsteelblue;
    }
    #item-9{
        background-color: lightyellow;
    }
    #item-10{
        background-color: lightgreen;
    }               
    #item-11{
        background-color: lightsalmon;
    }
    #item-12{
        background-color: lightblue;
    }
    #item-13{
        background-color: lightcoral;
    }
    #item-14{
        background-color: lightseagreen;
    }
    #item-15{
        background-color: lightgoldenrodyellow;
    }

</style>
